<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Bag Handle -->
  <path d="M196 200 C196 140 316 140 316 200" stroke="url(#handleGrad)" stroke-width="24" stroke-linecap="round" fill="none" />

  <!-- Bag Body -->
  <rect x="136" y="190" width="240" height="230" rx="36" fill="url(#bagGrad)" filter="url(#glow)" />

  <!-- Digital Code / Spark Icon inside Bag -->
  <path d="M226 270 L190 305 L226 340" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M286 270 L322 305 L286 340" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M266 265 L246 345" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" />

  <!-- Android style accent dot -->
  <circle cx="390" cy="140" r="16" fill="#34d399" />
  <circle cx="120" cy="150" r="12" fill="#38bdf8" />
</svg>
